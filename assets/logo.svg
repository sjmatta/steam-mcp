<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">steam-mcp game library mascot</title>
  <desc id="desc">A smiling little library box with colorful game cards and three connected dots.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y2="1">
      <stop stop-color="#292b66" />
      <stop offset="1" stop-color="#126a75" />
    </linearGradient>
    <linearGradient id="box" x1="0" x2="0" y2="1">
      <stop stop-color="#fff3ce" />
      <stop offset="1" stop-color="#ffce8c" />
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#background)" />
  <circle cx="37" cy="53" r="4" fill="#9ce8df" />
  <circle cx="215" cy="48" r="3" fill="#ffe298" />
  <path d="m200 76 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#a8f2e3" />

  <!-- Three imaginary game cases peek out of the library. -->
  <g stroke="#202b57" stroke-linejoin="round" stroke-width="4">
    <rect x="54" y="45" width="45" height="91" rx="9" fill="#ff7292" transform="rotate(-9 76 91)" />
    <rect x="107" y="37" width="44" height="94" rx="9" fill="#79d9cf" />
    <rect x="157" y="47" width="45" height="88" rx="9" fill="#ffbd65" transform="rotate(9 179 91)" />
  </g>
  <path d="m74 67 3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff4d3" />
  <circle cx="129" cy="75" r="11" fill="#fff4d3" />
  <path d="m129 64v22m-11-11h22" stroke="#3b7c89" stroke-width="4" stroke-linecap="round" />
  <path d="m178 69 11 19h-22z" fill="#fff4d3" />

  <!-- The shelf is also the mascot's face. -->
  <rect x="32" y="117" width="192" height="87" rx="24" fill="url(#box)" stroke="#202b57" stroke-width="6" />
  <path d="M35 143h186" stroke="#f4a85f" stroke-width="5" />
  <ellipse cx="84" cy="164" rx="6" ry="8" fill="#24315f" />
  <ellipse cx="172" cy="164" rx="6" ry="8" fill="#24315f" />
  <circle cx="62" cy="177" r="10" fill="#ff9b90" opacity=".75" />
  <circle cx="194" cy="177" r="10" fill="#ff9b90" opacity=".75" />
  <path d="M112 174q16 17 32 0" fill="none" stroke="#24315f" stroke-width="5" stroke-linecap="round" />

  <!-- Small linked nodes hint at the MCP connection. -->
  <path d="M99 205v13m58-13v13m-58 0h58" fill="none" stroke="#a8f2e3" stroke-width="5" stroke-linecap="round" />
  <circle cx="99" cy="224" r="7" fill="#ff7292" />
  <circle cx="128" cy="224" r="7" fill="#ffe298" />
  <circle cx="157" cy="224" r="7" fill="#79d9cf" />
</svg>
